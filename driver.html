<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15110f">
<title>RMI Driver</title>
<link rel="icon" href="assets/logo-rmi.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Desktop: ponsel di tengah panggung gelap. HP: aplikasi penuh layar. */
  body { background: #0d0a09; }
  .stage { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 48px; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(60% 70% at 50% 40%, #2a1714 0%, #0d0a09 70%); }
  .aside { color: #c9c0bb; justify-self: end; max-width: 300px; }
  .aside img { width: 120px; border-radius: 10px; background: #fff; padding: 4px; }
  .aside h1 { color: #fff; font-size: 44px; font-weight: 800; margin: 18px 0 10px; text-transform: uppercase; }
  .aside p { margin: 0 0 16px; }
  .aside a { color: #fff; font-weight: 600; }
  .phone { width: 390px; height: min(820px, calc(100vh - 56px)); min-height: 660px; background: var(--card); border-radius: 44px; border: 11px solid #050403; box-shadow: 0 0 0 1px #2b2421, 0 40px 90px rgba(0, 0, 0, .6); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .phone::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 20px; background: #050403; z-index: 10; }
  .screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); scrollbar-width: none; }
  .screen > * { flex-shrink: 0; }

  /* login */
  .login { flex: 1; display: flex; flex-direction: column; background: var(--panel); color: #fff; }
  .login .hero { padding: 64px 24px 30px; background: radial-gradient(120% 90% at 100% 0%, #4a1715 0%, transparent 60%); }
  .login .hero img { width: 120px; border-radius: 10px; background: #fff; padding: 4px; }
  .login h2 { font-size: 40px; font-weight: 800; text-transform: uppercase; margin: 22px 0 6px; }
  .login .hero p { color: #b3a9a3; margin: 0; }
  .login form { background: var(--card); color: var(--ink); border-radius: 26px 26px 0 0; padding: 24px 22px 28px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .tel { display: flex; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
  .tel span { padding: 12px; background: var(--bg); font-weight: 650; border-right: 1px solid var(--line-2); }
  .tel input { border: 0; flex: 1; padding: 12px; min-width: 0; background: var(--card); }
  .tel:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
  .pin-row { display: flex; gap: 10px; }
  .pin-row input { width: 52px; height: 56px; text-align: center; font: 700 22px var(--display); border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
  .pin-row input:focus { outline: none; border-color: var(--red); }
  .saved { display: flex; flex-direction: column; gap: 6px; }
  .saved button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; text-align: left; }
  .saved button:hover { border-color: var(--ink-2); }
  .saved .avatar { width: 32px; height: 32px; border-radius: 50%; font-size: 12px; }

  /* app */
  .p-head { background: var(--panel); color: #fff; padding: 52px 20px 72px; position: relative; overflow: hidden; }
  .p-head::after { content: ""; position: absolute; right: -80px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(224, 35, 42, .45), transparent 70%); }
  .p-head .top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .p-head .top img { height: 30px; border-radius: 6px; background: #fff; padding: 2px; }
  .p-head .hi { margin-top: 18px; font-size: 13px; color: #b3a9a3; position: relative; z-index: 1; }
  .p-head .hi b { display: block; font-family: var(--display); font-size: 30px; font-weight: 800; color: #fff; letter-spacing: .01em; line-height: 1.1; }
  .bell { position: relative; width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; place-items: center; border: 0; color: #fff; }
  .bell i { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #2a201c; }
  .p-body { padding: 0 16px 24px; margin-top: -52px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 2; }
  .due { background: var(--card); border-radius: 22px; padding: 20px; box-shadow: 0 12px 30px rgba(0, 0, 0, .12); }
  .due.late { background: linear-gradient(150deg, #e0232a, #a5121a); color: #fff; }
  .due.late .label, .due.late .muted { color: rgba(255,255,255,.8); }
  .due .amt { font-family: var(--display); font-size: 48px; font-weight: 800; line-height: 1; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
  .due.ok .amt { color: var(--good); }
  .pay-btn { width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: 14px; background: var(--red); color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(224, 35, 42, .3); }
  .due.late .pay-btn { background: #fff; color: #b8161c; box-shadow: none; }
  .pay-btn:active { transform: scale(.99); }
  .pay-btn[disabled] { opacity: .6; }
  .week { display: flex; justify-content: space-between; gap: 6px; }
  .week div { flex: 1; text-align: center; font-size: 11px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .week i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: #fff; }
  .week .ok i { background: var(--good); }
  .week .no i { background: var(--bad-soft); color: var(--bad); border: 1.5px dashed var(--bad); }
  .week .td i { background: var(--card); border: 2px solid var(--ink); color: var(--ink); }
  .tile { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--line); }
  .tile-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .tile-h b { font-family: var(--display); font-size: 19px; }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .quick button, .quick a { border: 0; background: var(--card); border-radius: 16px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; text-decoration: none; color: var(--ink); border: 1px solid var(--line); }
  .quick .q { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--red-soft); color: var(--red); }
  .unit-big { display: flex; align-items: center; gap: 14px; }
  .unit-big .carpic { width: 120px; height: 54px; color: var(--ink); }
  .tabs { display: flex; border-top: 1px solid var(--line); background: var(--card); padding: 6px 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .tabs button { flex: 1; border: 0; background: none; padding: 6px 4px; font-size: 11px; font-weight: 600; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 12px; }
  .tabs button[aria-current="page"] { color: var(--red); }
  .tabs button[aria-current="page"] .ic { background: var(--red-soft); border-radius: 10px; }
  .tabs .ic { width: 44px; height: 28px; padding: 4px 12px; box-sizing: border-box; }
  .sub-head { display: flex; align-items: center; gap: 12px; padding: 50px 16px 14px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
  .sub-head h2 { font-size: 26px; font-weight: 800; }
  .sub-head .back { border: 0; background: var(--bg); width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .method { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; background: var(--card); width: 100%; text-align: left; transition: border-color .15s; }
  .method:hover { border-color: var(--red); }
  .method .logo { width: 48px; height: 32px; border-radius: 8px; display: grid; place-items: center; font: 800 11px var(--body); color: #fff; flex: none; letter-spacing: .02em; }
  .method .grow { flex: 1; }
  .rec { font-size: 11px; font-weight: 700; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 3px 9px; }
  .pay-card { background: var(--card); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; border: 1px solid var(--line); }
  .qr-box { background: #fff; padding: 14px; border-radius: 16px; border: 1px solid var(--line); position: relative; }
  .qr-box canvas { display: block; width: 216px; height: 216px; image-rendering: pixelated; }
  .qr-box .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; padding: 4px; border-radius: 8px; }
  .qr-box .mid img { width: 54px; display: block; }
  .qris-mark { font: 800 22px var(--body); letter-spacing: .04em; color: #111; }
  .va { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: .08em; text-align: center; font-variant-numeric: tabular-nums; }
  .waiting { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; color: var(--warn); background: var(--warn-soft); padding: 7px 12px; border-radius: 999px; }
  .waiting i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .timer { font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .success { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 22px 24px; gap: 12px; text-align: center; background: linear-gradient(180deg, var(--good-soft), var(--bg) 45%); }
  .big-check { width: 96px; height: 96px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 12px color-mix(in srgb, var(--good) 18%, transparent); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .receipt { width: 100%; background: var(--card); border-radius: 18px; padding: 6px 16px; border: 1px solid var(--line); text-align: left; }
  .receipt div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; font-size: 13.5px; border-top: 1px dashed var(--line); }
  .receipt div:first-child { border-top: 0; }
  .hist { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
  .slot { aspect-ratio: 4/3; border: 1.5px dashed var(--line-2); border-radius: 12px; display: grid; place-items: center; text-align: center; font-size: 11.5px; color: var(--ink-2); cursor: pointer; overflow: hidden; position: relative; background: var(--card); gap: 4px; align-content: center; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .slot.done::after { content: "✓"; position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: #fff; font-size: 11px; display: grid; place-items: center; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .profile-top { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 54px 16px 22px; background: var(--card); border-bottom: 1px solid var(--line); text-align: center; }
  .profile-top .avatar { width: 76px; height: 76px; border-radius: 50%; font-size: 26px; }
  .menu-list { background: var(--card); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
  .menu-list > * { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; text-decoration: none; color: var(--ink); }
  .menu-list > *:first-child { border-top: 0; }
  .menu-list .r { margin-left: auto; color: var(--ink-2); font-size: 13px; }
  @media (max-width: 960px) { .aside { display: none; } .stage { grid-template-columns: 1fr; justify-items: center; } }
  @media (max-width: 480px) {
    body { background: var(--bg); }
    .stage { padding: 0; display: block; background: none; }
    .phone { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
    .phone::before { display: none; }
    .p-head, .login .hero { padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
    .sub-head, .profile-top { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
    .success { padding-top: calc(40px + env(safe-area-inset-top, 0px)); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="aside">
    <img src="assets/logo-rmi.jpg" alt="RMI">
    <h1>Aplikasi Driver</h1>
    <p>Setor sewa harian lewat QRIS atau Virtual Account. Status lunas langsung terlihat oleh admin RMI.</p>
    <p class="small">Buka di HP untuk pengalaman terbaik.</p>
  </div>
  <div class="phone">
    <div class="screen" id="screen"></div>
    <nav class="tabs" id="tabs" aria-label="Menu driver" hidden></nav>
  </div>
  <div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/driver.js"></script>
</body>
</html>
